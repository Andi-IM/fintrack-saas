name: Deploy FinTrack MCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare remote dir
        run: |
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'mkdir -p /opt/fintrack-mcp'

      - name: Transfer docker-compose.yml (via cat, bukan scp)
        run: |
          cat ./mcp-server/docker-compose.vps.yml | \
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'cat > /opt/fintrack-mcp/docker-compose.yml'

      - name: Pull latest image
        run: |
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'podman pull ghcr.io/andi-im/fintrack-saas-mcp:latest'

      - name: Verify image
        run: |
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'podman images ghcr.io/andi-im/fintrack-saas-mcp'

      - name: Restart via podman compose
        run: |
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'cd /opt/fintrack-mcp && podman compose down --remove-orphans 2>/dev/null || true && podman compose up -d'

      - name: Test MCP connection
        run: |
          ssh -i ~/.ssh/id_vps -o StrictHostKeyChecking=accept-new ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '/home/ubuntu/.local/bin/hermes mcp test fintrack'
