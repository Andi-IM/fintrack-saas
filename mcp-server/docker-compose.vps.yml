services:
  mcp-server:
    image: ghcr.io/andi-im/fintrack-saas-mcp:latest
    container_name: fintrack-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    # Mount the agent's image cache read-only so host file paths (e.g. the
    # Hermes Telegram cache) can be read inside the container. Pair with
    # MCP_HOST_IMAGE_DIR / MCP_CONTAINER_IMAGE_DIR in .env to auto-map paths.
    volumes:
      - /home/ubuntu/.hermes/cache/images:/app/hermes-images:ro
    # Rootless Podman remaps UIDs; keep-id maps the container user (uid 1000)
    # back to the host ubuntu user so the 0700 image cache stays readable
    # without loosening host permissions. gid 1001 matches the host ubuntu group.
    userns_mode: "keep-id:uid=1000,gid=1001"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
